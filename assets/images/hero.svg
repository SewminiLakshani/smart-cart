<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1000">
  <defs>
    <radialGradient id="glow" cx="70%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#d4af6a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0b0b0d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bgg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141317"/>
      <stop offset="100%" stop-color="#0b0b0d"/>
    </linearGradient>
    <linearGradient id="goldg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8cd9a"/>
      <stop offset="100%" stop-color="#b9903f"/>
    </linearGradient>
  </defs>
  <rect width="900" height="1000" fill="url(#bgg)"/>
  <rect width="900" height="1000" fill="url(#glow)"/>
  <!-- podium -->
  <ellipse cx="450" cy="760" rx="260" ry="34" fill="#000" opacity="0.5"/>
  <rect x="330" y="640" width="240" height="120" rx="6" fill="#1c1b1f" stroke="#3a3a40"/>
  <!-- product silhouette: watch/box -->
  <circle cx="450" cy="470" r="150" fill="none" stroke="url(#goldg)" stroke-width="3" opacity="0.9"/>
  <circle cx="450" cy="470" r="115" fill="#17171a" stroke="url(#goldg)" stroke-width="2"/>
  <circle cx="450" cy="470" r="6" fill="url(#goldg)"/>
  <line x1="450" y1="470" x2="450" y2="400" stroke="url(#goldg)" stroke-width="4" stroke-linecap="round"/>
  <line x1="450" y1="470" x2="500" y2="470" stroke="url(#goldg)" stroke-width="4" stroke-linecap="round"/>
  <rect x="410" y="330" width="80" height="40" rx="8" fill="#17171a" stroke="url(#goldg)" stroke-width="2"/>
  <rect x="410" y="570" width="80" height="40" rx="8" fill="#17171a" stroke="url(#goldg)" stroke-width="2"/>
  <!-- floating accents -->
  <circle cx="180" cy="220" r="4" fill="#d4af6a"/>
  <circle cx="720" cy="300" r="3" fill="#d4af6a"/>
  <circle cx="660" cy="620" r="5" fill="#d4af6a" opacity="0.7"/>
  <circle cx="220" cy="700" r="3" fill="#d4af6a" opacity="0.6"/>
  <text x="450" y="900" font-family="Georgia, serif" font-size="22" fill="#77777d" text-anchor="middle" letter-spacing="6">CURATED · PREMIUM · TIMELESS</text>
</svg>
